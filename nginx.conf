# Config mínima para servir estáticos con muy poca RAM (ideal Raspberry Pi).
# Reemplaza el nginx.conf por defecto (no incluye conf.d).
user nginx;
worker_processes 1;                 # 1 solo worker -> ~6-8 MB de RAM en total
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 64;          # de sobra para uso doméstico
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 30;
    access_log    off;              # sin log de accesos = menos I/O y RAM

    gzip on;
    gzip_types text/css application/javascript;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            add_header Cache-Control "no-cache";   # revalida; nunca sirve JS/CSS viejo
            try_files $uri $uri/ /index.html;
        }
    }
}
