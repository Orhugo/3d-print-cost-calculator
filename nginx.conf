# Minimal config to serve static files with very little RAM (ideal Raspberry Pi).
# Replaces the default nginx.conf (does not include conf.d).
user nginx;
worker_processes 1;                 # a single worker -> ~6-8 MB RAM in total
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 64;          # plenty for home use
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 30;
    access_log    off;              # no access log = less I/O and RAM

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Astro's hashed assets (/_astro/…): the filename changes with the content,
        # so they can be cached "forever" without ever serving a stale version.
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";   # the HTML always revalidates
            try_files $uri $uri/ /index.html;
        }
    }
}
