services:
  costes3d:
    build: .
    container_name: costes3d
    image: costes3d:latest
    ports:
      - "8088:80"          # http://YOUR_SERVER:8088
    restart: unless-stopped

    # --- Optional resource caps ---
    # Left out on purpose: they need memory cgroups enabled (often OFF by
    # default on Raspberry Pi OS), and mixing them with tools like CasaOS —
    # which rewrite the compose into the newer `deploy.resources` schema —
    # produces an invalid file. The app uses ~6-8 MB at idle regardless.
    # To enable them, first add `cgroup_enable=memory cgroup_memory=1` to the
    # kernel cmdline (see README) and then uncomment:
    # mem_limit: 32m
    # pids_limit: 32
    # cpus: 0.5
