services:
  costes3d:
    build: .
    container_name: costes3d
    image: costes3d:latest
    ports:
      - "8088:80"          # http://YOUR_SERVER:8088
    restart: unless-stopped

    # --- Limits so it can't overload the Raspberry Pi ---
    mem_limit: 32m           # hard RAM cap (uses ~6-8 MB at idle)
    mem_reservation: 16m
    pids_limit: 32
    cpus: 0.5                # at most half a core (way more than enough)
